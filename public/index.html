<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Domain Tracker</title>

  <link rel="stylesheet" href="style.css" />

  <!-- 🌍 Globe (Three.js + Globe.gl) -->
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl"></script>
</head>

<body>

<div class="scanlines"></div>

<div class="topbar">
  <div class="brand">
    <span class="brand-icon">◆</span>
    <span class="brand-accent">DOMAIN RADAR</span>
  </div>

  <div class="topbar-mid">
    <div class="live-dot"></div>
    <div class="live-label">LIVE INTEL FEED</div>
  </div>

  <div class="topbar-right">
    <input id="search" class="search-input" placeholder="Search domain..." />
    <button class="btn-refresh" onclick="loadData()">REFRESH</button>
  </div>
</div>

<div class="status-bar" id="status">Initializing...</div>

<div class="grid">

  <!-- LEFT PANEL -->
  <div class="panel">
    <div class="panel-head">LIVE DOMAINS</div>
    <div class="log-list" id="list"></div>
  </div>

  <!-- RIGHT PANEL (GLOBE) -->
  <div class="panel panel-globe">
    <div class="panel-head">GLOBAL INTELLIGENCE MAP</div>

    <div class="globe-stage">
      <div id="globe"></div>
    </div>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
